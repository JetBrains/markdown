name: Test

on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install libncurses for Kotlin compiler
        run: sudo apt-get install -y libncurses6

      - name: Perform checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and run tests with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          arguments: check --stacktrace

      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-report-${{ runner.os }}
          path: build/reports
          if-no-files-found: warn

  macos-tests:
    runs-on: macos-latest
    steps:
      - name: Perform checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and run tests with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          arguments: macosArm64Test macosX64Test iosSimulatorArm64Test iosX64Test tvosSimulatorArm64Test tvosX64Test watchosSimulatorArm64Test watchosX64Test --stacktrace

      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-report-${{ runner.os }}
          path: build/reports
          if-no-files-found: warn

  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Perform checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and run tests with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          arguments: mingwX64Test --stacktrace

      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-report-${{ runner.os }}
          path: build/reports
          if-no-files-found: warn

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5G  -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
